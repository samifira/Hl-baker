name: Build HL Baker

# Builds the desktop app for Windows, macOS (Apple Silicon) and Linux, smoke-tests each build,
# and uploads it as a workflow artifact. Publishing a GitHub Release (or pushing a tag like
# v1.0.0) also attaches the zipped builds to that release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]   # creating a release on GitHub builds and attaches the downloads
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest        # Apple Silicon (Blender 5 has no Intel macOS build)
            name: macos-arm64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # must match the bpy wheel

      - name: Linux system libraries for Qt / Blender
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libegl1 libgl1 libsm6 libxi6 libxxf86vm1 libxfixes3 libxrender1 xvfb libgl1-mesa-dri

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Test from source (CLI)
        run: python hlbake_main.py bake tests/props_low.fbx tests/props_high.fbx -o out_src -m game -s 128 --aa 1 --samples 4 --device CPU --cage-offset 0.3

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm hlbake.spec

      - name: "Windows: bundle a modern software OpenGL (Mesa llvmpipe) for PCs without GL 3.3"
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Qt's own opengl32sw.dll is Mesa 11 (OpenGL 3.0 only); replace it with current Mesa (GL 4.5)
          fetch() {   # $1 = release tag, or "latest"
            rm -rf mesa && mkdir mesa
            if [ "$1" = latest ]; then
              gh release download --repo pal1000/mesa-dist-win --pattern "*release-msvc.7z" --dir mesa
            else
              gh release download "$1" --repo pal1000/mesa-dist-win --pattern "*release-msvc.7z" --dir mesa
            fi
            for a in mesa/*.7z; do 7z x -y -omesa/x "$a" > /dev/null; done
            GL=$(find mesa/x -ipath "*x64*" -iname opengl32.dll | head -1)
          }
          fetch latest
          if [ -z "$GL" ]; then
            echo "No x64 opengl32.dll in the latest package; layout:"; find mesa/x -maxdepth 2 | head -40
            fetch 26.1.8
          fi
          [ -n "$GL" ] || { echo "Mesa OpenGL not found"; exit 1; }
          SRC=$(dirname "$GL"); echo "Using Mesa from $SRC ($(ls mesa/*.7z))"
          for d in dist/HLBaker/_internal dist/HLBaker/_internal/PySide6; do
            cp "$GL" "$d/opengl32sw.dll"
            for dep in libgallium_wgl.dll libglapi.dll; do
              [ -f "$SRC/$dep" ] && cp "$SRC/$dep" "$d/"
            done
          done
          ls -la dist/HLBaker/_internal | grep -iE "opengl32sw|gallium|glapi"

      - name: Locate build
        id: paths
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "cli=dist/HLBaker.app/Contents/MacOS/hlbake" >> $GITHUB_OUTPUT
            echo "gui=dist/HLBaker.app/Contents/MacOS/HLBaker" >> $GITHUB_OUTPUT
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "cli=dist/HLBaker/hlbake.exe" >> $GITHUB_OUTPUT
            echo "gui=dist/HLBaker/HLBaker.exe" >> $GITHUB_OUTPUT
          else
            echo "cli=dist/HLBaker/hlbake" >> $GITHUB_OUTPUT
            echo "gui=dist/HLBaker/HLBaker" >> $GITHUB_OUTPUT
          fi

      - name: Smoke test packaged CLI (bake)
        shell: bash
        run: |
          "${{ steps.paths.outputs.cli }}" bake tests/props_low.fbx tests/props_high.fbx -o out_frozen \
            -m all -s 128 --aa 1 --samples 4 --device CPU --cage-offset 0.3
          ls out_frozen
          test $(ls out_frozen | wc -l) -eq 14

      - name: Smoke test packaged corrected-mesh export
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          json.dump({"files": [
              {"path": os.path.abspath("tests/props_low.fbx"), "role": "low"},
              {"path": os.path.abspath("tests/props_high_cm_yup.fbx"), "role": "high",
               "transform": {"loc": [0, 0, 0], "rot": [90, 0, 0], "scale": [0.01, 0.01, 0.01]}}],
              "settings": {}}, open("export_test.hlbake", "w"))
          PY
          "${{ steps.paths.outputs.cli }}" worker export export_test.hlbake --format SAME | grep '"event": "exported"'
          test -f tests/props_high_cm_yup_aligned.fbx

      - name: Smoke test packaged GUI (loads meshes via its worker, screenshots, quits)
        shell: bash
        run: |
          export HLBAKE_SELFTEST="$PWD/selftest-${{ matrix.name }}.json"
          GUI="${{ steps.paths.outputs.gui }}"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" "$GUI" tests/props_low.fbx tests/props_high.fbx &
          else
            "$GUI" tests/props_low.fbx tests/props_high.fbx &
          fi
          for i in $(seq 1 150); do [ -f "$HLBAKE_SELFTEST" ] && break; sleep 1; done
          echo "--- self-test log"; cat "${HLBAKE_SELFTEST%.json}.log" 2>/dev/null || true; echo "---"
          cat "$HLBAKE_SELFTEST"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['exit']==0 and len(d['groups'])==2; print('3D viewer OpenGL:', d.get('viewer_gl'), d.get('gl_renderer'), '| software:', d.get('software_gl'), '| probe:', d.get('gl_probe'), '| sw dll:', d.get('opengl32sw_in'), '| err:', d.get('gl_error'), '| diag:', d.get('gl_diag'))" "$HLBAKE_SELFTEST"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.name }}
          path: selftest-${{ matrix.name }}.*

      - name: Add licence texts
        shell: bash
        run: |
          DEST=dist/HLBaker
          [ "$RUNNER_OS" = "macOS" ] && DEST=dist/HLBaker.app/Contents/Resources
          curl -sSfL https://www.gnu.org/licenses/gpl-3.0.txt -o "$DEST/GPL-3.0.txt"
          cp LICENSE README.md "$DEST/"

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip ../HLBaker-${{ matrix.name }}.zip HLBaker > /dev/null
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent HLBaker.app ../HLBaker-${{ matrix.name }}.zip
          else
            tar -czf ../HLBaker-${{ matrix.name }}.tar.gz HLBaker
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: HLBaker-${{ matrix.name }}
          path: HLBaker-${{ matrix.name }}.*
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HLBaker-${{ matrix.name }}.*
